aid: ennoblecare
name: Ennoble Care
description: >-
  Ennoble Care is a physician-led home-based healthcare provider delivering
  primary care, palliative care, and hospice care to seniors in the comfort of
  their own homes. Founded to bring the doctor back to the housecall, the company
  offers in-home primary care and chronic disease management, post-acute care
  transitions, advance care planning, bereavement services, and respite care
  across 13 states and Washington, DC (Alabama, Florida, Georgia, Kansas,
  Maryland, Missouri, New Jersey, New York, Oklahoma, Pennsylvania, Texas, and
  Virginia). Ennoble Care is a portfolio company of Norwest Venture Partners.
  This profile has been enriched by the API Evangelist network; Ennoble Care is a
  healthcare-services company and publishes no public developer API, SDKs, or
  developer portal at this time.
